<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analyst Ledger – TikTok connection</title>

<body><h1>TikTok connection</h1><p><a href="/">← Analyst Ledger</a></p><div id="out">Reading response…</div>
<script>
var p=new URLSearchParams(location.search),o=document.getElementById('out');
if(p.get('code')){o.innerHTML='<p>Authorization succeeded. Copy this one-time code and paste it into the <b>Connect TikTok</b> workflow on GitHub within 5 minutes:</p><code></code><p>Then you can close this page.</p>';o.querySelector('code').textContent=p.get('code');}
else if(p.get('error')){o.textContent='TikTok returned an error: '+p.get('error')+' '+(p.get('error_description')||'');}
else{var u='https://www.tiktok.com/v2/auth/authorize/?'+new URLSearchParams({client_key:'awodqgyrvfrk1jt9',scope:'user.info.basic,video.publish,video.upload',response_type:'code',redirect_uri:'https://analystledger.github.io/tiktok-callback.html',state:Math.random().toString(36).slice(2)});
o.innerHTML='<p>Connect the Analyst Ledger TikTok account so the site can post its weekly analyst-rating recap and major rating-change alerts as photo posts.</p><p><a id="go" style="display:inline-block;background:#fe2c55;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none;font-weight:600">Continue with TikTok</a></p><p style="color:#5b6b80;font-size:14px">We request: basic profile info (to confirm the account), direct post and upload. Not investment advice.</p>';o.querySelector('#go').href=u;}
</script></body></html>
